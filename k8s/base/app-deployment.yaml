apiVersion: apps/v1
kind: Deployment

metadata:
  name: s3-monitor
  labels:
    app: s3-monitor
spec:
  replicas: 1
  revisionHistoryLimit: 3             
  selector:
    matchLabels:
      app: s3-monitor             
  template:                  
    metadata:
      labels:
        app: s3-monitor          
    spec:
      containers:
        - name: s3-monitor-container
          image: s3-compliance-monitor:latest
          imagePullPolicy: IfNotPresent
          ports:
          - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: s3-monitor-config
            - secretRef:
                name: s3-monitor-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi